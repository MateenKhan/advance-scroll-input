# THE PER-PROJECT FILE. This is the entire thing.
#
# Copy per new subdomain, changing only the router names and the hostname.
# Save as e.g. /data/coolify/proxy/dynamic/table.yaml — Traefik watches that
# directory and hot-reloads. Nothing restarts, no other site is affected.
#
# nginx needs no change at all: it derives the web root from the Host header,
# so table.jugaaadi.com is served from /var/www/sites/table.jugaaadi.com/.
#
# Field names mirror Coolify's own coolify.yaml: entrypoints are `http` and
# `https` (not web/websecure), and the key is lowercase `certresolver`.

http:
  routers:
    # The http router is not optional — it is what answers the Let's Encrypt
    # HTTP-01 challenge. Without it no certificate is ever issued and the
    # site fails TLS at the origin (Cloudflare reports 526).
    table-http:
      entryPoints:
        - http
      service: host-nginx
      rule: Host(`table.jugaaadi.com`)

    table-https:
      entryPoints:
        - https
      service: host-nginx
      rule: Host(`table.jugaaadi.com`)
      tls:
        certresolver: letsencrypt
