# One nginx block that serves every static site on this box.
#
# The web root is derived from the requested hostname, so adding a site is
# just creating a folder — this file is never edited again:
#
#   /var/www/sites/scroll-input.jugaaadi.com/
#   /var/www/sites/another-project.jugaaadi.com/
#
# Listens on 8080 because Coolify's proxy owns 80/443 and terminates TLS.

map $host $safe_host {
    # Only ever resolve to a plain hostname directory. Anything unexpected
    # falls through to an empty value and 404s, so a spoofed Host header
    # cannot walk out of /var/www/sites.
    default                      "";
    "~^(?<h>[a-z0-9.-]+)$"       $h;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/sites/$safe_host;
    index index.html;

    access_log /var/log/nginx/sites.access.log;
    error_log  /var/log/nginx/sites.error.log;

    # Static site generators emit directory-based routes
    # (/docs/intro/index.html), so this resolves everything without an SPA
    # fallback. Add `$uri.html` here if you deploy a generator that emits
    # flat .html files instead.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hashed asset filenames can be cached indefinitely.
    location ~* /(assets|static)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must not be cached, or a deploy never reaches returning visitors.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
