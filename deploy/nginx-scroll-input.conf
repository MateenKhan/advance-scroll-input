# Host nginx for scroll-input.jugaaadi.com
#
# Listens on 8081, NOT 80/443 — Coolify's proxy owns those. Coolify terminates
# TLS and forwards here, so there is no ssl_* config in this file.
#
# Install:
#   sudo cp nginx-scroll-input.conf /etc/nginx/sites-available/scroll-input
#   sudo ln -s /etc/nginx/sites-available/scroll-input /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8081;
    listen [::]:8081;
    server_name scroll-input.jugaaadi.com;

    root /var/www/scroll-input;
    index index.html;

    access_log /var/log/nginx/scroll-input.access.log;
    error_log  /var/log/nginx/scroll-input.error.log;

    # Docusaurus emits a real HTML file per route, so this is not an SPA
    # fallback — `$uri.html` lets /docs/intro resolve to /docs/intro.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Asset filenames are content-hashed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must not be cached, or a deploy never reaches returning visitors.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
